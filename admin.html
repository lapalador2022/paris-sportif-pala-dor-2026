<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Admin – Paris Pelote</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0D0D0D;
      color: #FFFFFF;
      padding: 20px;
      max-width: 700px;
      margin: auto;
    }

    h2 {
      color: #FF9900;
      margin-top: 30px;
      margin-bottom: 10px;
    }

    .section {
      background: #1A1A1A;
      border: 1px solid #333;
      padding: 20px;
      border-radius: 10px;
      margin-top: 20px;
    }

    label {
      font-weight: bold;
      margin-top: 10px;
      display: block;
      color: #FF9900;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 5px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #0D0D0D;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      border-radius: 6px;
      border: none;
      background: #FF9900;
      color: #000;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #e68a00;
    }

    .status-line {
      margin: 5px 0;
      font-size: 16px;
    }

    .status-value {
      color: #FF9900;
      font-weight: bold;
    }

    .btn-grey {
      background: #444;
      color: white;
    }
  </style>
</head>

<body>

  <h2>État des paris</h2>
  <div class="section">
    <div class="status-line">Partie actuelle : <span id="etatPartie" class="status-value">Chargement...</span></div>
    <div class="status-line">Lot : <span id="etatLot" class="status-value">Chargement...</span></div>
    <div class="status-line">Statut : <span id="etatStatut" class="status-value">Chargement...</span></div>
    <div class="status-line">Fermeture dans : <span id="etatTimer" class="status-value">--</span></div>
  </div>

  <h2>Gestion de la partie</h2>
  <div class="section">
    <label>Nom de la partie</label>
    <input type="text" id="partieInput" placeholder="Ex: Finale A vs B">

    <button id="btnMajPartie">Mettre à jour la partie</button>
    <button id="btnNouvellePartie" class="btn-grey">Nouvelle partie (vider les paris)</button>
  </div>

  <h2>Lot à gagner</h2>
  <div class="section">
    <label>Lot</label>
    <input type="text" id="lotInput" placeholder="Ex: Panier garni">

    <button id="btnMajLot">Mettre à jour le lot</button>
  </div>

  <h2>Timer & ouverture</h2>
  <div class="section">
    <button id="btnOuvrir">Ouvrir les paris</button>

    <label>Durée avant fermeture (minutes)</label>
    <input type="number" id="dureeInput" value="5">

    <button id="btnFermer">Démarrer le timer & fermer automatiquement</button>
  </div>

  <h2>Export des paris</h2>
  <div class="section">
    <button id="btnExportCSV">Exporter en CSV</button>
  </div>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, updateDoc, setDoc, getDoc, onSnapshot } 
      from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD7OYOYbs3t8XiKnsiEsGdLEkUl4DfrvI",
      authDomain: "paris-pala-d-or-2026.firebaseapp.com",
      projectId: "paris-pala-d-or-2026",
      storageBucket: "paris-pala-d-or-2026.firebasestorage.app",
      messagingSenderId: "711498857592",
      appId: "1:711498857592:web:c7dbbd28d1ab7ada26418d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const ref = doc(db, "paris", "participants");

    let timerInterval = null;

    onSnapshot(ref, (snap) => {
      if (!snap.exists()) return;
      const data = snap.data();

      document.getElementById("etatPartie").innerText = data.partieCourante || "--";
      document.getElementById("etatLot").innerText = data.lot || "--";
      document.getElementById("etatStatut").innerText = data.parisOuverts ? "OUVERTS" : "FERMÉS";

      if (timerInterval) clearInterval(timerInterval);

      if (data.parisOuverts && data.fermetureTimestamp) {
        function updateTimer() {
          const diff = data.fermetureTimestamp - Date.now();
          if (diff <= 0) {
            document.getElementById("etatTimer").innerText = "0m 0s";
            return;
          }
          const m = Math.floor(diff / 60000);
          const s = Math.floor((diff % 60000) / 1000);
          document.getElementById("etatTimer").innerText = `${m}m ${s}s`;
        }
        updateTimer();
        timerInterval = setInterval(updateTimer, 1000);
      } else {
        document.getElementById("etatTimer").innerText = "--";
      }
    });

    document.getElementById("btnMajPartie").onclick = async () => {
      const partie = document.getElementById("partieInput").value.trim();
      if (!partie) return alert("Nom de partie vide.");
      await updateDoc(ref, { partieCourante: partie });
      alert("Partie mise à jour.");
    };

    document.getElementById("btnNouvellePartie").onclick = async () => {
      await updateDoc(ref, {
        liste: [],
        partieCourante: "",
        lot: "",
        parisOuverts: false,
        fermetureTimestamp: 0
      });
      alert("Nouvelle partie créée.");
    };

    document.getElementById("btnMajLot").onclick = async () => {
      const lot = document.getElementById("lotInput").value.trim();
      if (!lot) return alert("Lot vide.");
      await updateDoc(ref, { lot });
      alert("Lot mis à jour.");
    };

    document.getElementById("btnOuvrir").onclick = async () => {
      await updateDoc(ref, { parisOuverts: true });
      alert("Paris ouverts !");
    };

    document.getElementById("btnFermer").onclick = async () => {
      const minutes = parseInt(document.getElementById("dureeInput").value);
      const fermeture = Date.now() + minutes * 60000;

      await updateDoc(ref, {
        parisOuverts: true,
        fermetureTimestamp: fermeture
      });

      alert("Timer lancé !");
    };

    /* -------------------------
       EXPORT CSV
    --------------------------*/
    document.getElementById("btnExportCSV").onclick = async () => {
      const snap = await getDoc(ref);
      if (!snap.exists()) return alert("Aucune donnée.");

      const data = snap.data();
      const liste = data.liste || [];

      if (liste.length === 0) {
        alert("Aucun pari à exporter.");
        return;
      }

      let csv = "Nom;Prénom;Téléphone;Score;Partie;Date\n";

      liste.forEach(p => {
        const date = new Date(p.timestamp).toLocaleString("fr-FR");
        csv += `${p.nom};${p.prenom};${p.telephone};${p.score};${p.partie};${date}\n`;
      });

      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = "paris_pelote.csv";
      a.click();

      URL.revokeObjectURL(url);
    };
  </script>

</body>
</html>
